name: Release

# Builds a zip, attaches it to a GitHub release and uploads it to CurseForge
# whenever a tag is pushed.
#
# The CurseForge upload needs one repository secret:
#   CF_API_KEY   -> CurseForge API token (project ID 1706296 is already in the .toc)
# Without it the upload is skipped and the release is GitHub-only. Wago upload is
# still stubbed out: add WAGO_API_TOKEN and uncomment the env line below.

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
